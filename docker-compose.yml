name: divzy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-divzy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divzy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-divzy}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - divzy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-divzy} -d ${POSTGRES_DB:-divzy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev SMTP catcher — view outgoing emails at http://localhost:8026
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"

  # Full-stack containers: `docker compose --profile full up --build`
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-divzy}:${POSTGRES_PASSWORD:-divzy_dev_password}@postgres:5432/${POSTGRES_DB:-divzy}
      HOST: 0.0.0.0
      # WI-077 — must win over whatever NODE_ENV is baked into the copied
      # apps/api/.env (env_file below), which defaults to `development` per
      # .env.example. Without this override, a container built from this
      # compose file silently ran with dev-level debug logging AND
      # NODE_ENV-gated security behavior (e.g. non-secure auth cookies) even
      # though the Dockerfile's own `ENV NODE_ENV=production` says otherwise —
      # env_file/environment set at container-start time wins over the
      # image's baked-in ENV.
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  divzy-pgdata:
